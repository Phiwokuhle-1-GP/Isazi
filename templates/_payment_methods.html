<div class="payment-method-grid">{% for key,name,description in payment_methods %}<a class="payment-method payment-{{ key }}" href="{{ url_for('demo.payment_preview',token=order.token,method=key) if demo_payments_enabled and order else url_for('demo.provider_preview',method=key) }}"><strong>{{ name }}</strong><small>{{ description }}</small><span>{{ 'Choose →' if demo_payments_enabled and order else 'Preview →' }}</span></a>{% endfor %}</div>
