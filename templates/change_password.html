{% extends 'base.html' %}
{% block main %}
<div class="password-wrap"><div class="owner-section"><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change your password</h1><p>Use a unique password of at least 12 characters. For security, changing it signs you out.</p><form method="post" action="{{url_for('change_password')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="field"><label for="current_password">Current password</label><input name="current_password" id="current_password" type="password" autocomplete="current-password" required></div><div class="field"><label for="new_password">New password</label><input name="new_password" id="new_password" type="password" minlength="12" autocomplete="new-password" required></div><div class="field"><label for="confirm_password">Confirm new password</label><input name="confirm_password" id="confirm_password" type="password" minlength="12" autocomplete="new-password" required></div><button class="btn btn-primary" type="submit">Update password</button></form></div></div>
{% endblock %}
