{% extends 'base.html' %}{% block content %}<form method="post" class="panel login form-stack"><span class="eyebrow light">ORDER SUPPORT</span><h1>Track your order</h1><p>Use your private receipt link, or enter the details used at checkout.</p><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if limited %}<p class="error-text">Too many attempts. Please wait 15 minutes.</p>{% endif %}<label>Order reference<input name="reference" placeholder="ISZ-00001" required maxlength="20"></label><label>Checkout email<input type="email" name="email" required maxlength="200"></label><label>Last four phone digits<input name="phone_last4" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><button class="button">Find My Order →</button><a href="{{ url_for('eco.customer_account') }}">View my account orders</a></form>{% endblock %}
