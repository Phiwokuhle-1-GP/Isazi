<div class="bundle-quick-purchase">{% if not session.get('admin') and not hide_bundle_buy_now|default(false) %}<a class="button yellow full" href="{{ url_for('quick_buy',product_id=qr_product_id) }}">Buy Now →</a>{% endif %}{% if qr_base %}<details class="bundle-desktop-qr"><summary>Scan to buy this bundle</summary><img src="{{ url_for('simple.product_qr',product_id=qr_product_id) }}" alt="QR code to buy {{ qr_product_name }}" width="160" height="160" loading="lazy"></details>{% endif %}</div>
