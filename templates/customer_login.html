{% extends 'base.html' %}{% block content %}<div class="auth-layout"><section class="auth-intro"><span class="eyebrow">ISAZI HERBAL SHOP</span><h2>Welcome to Isazi</h2><p class="type-accent">Your journey starts here.</p><p>IYENQABA INKUNZI EGWEBAYO!!!</p></section><section class="panel login"><form method="post" class="form-stack"><h1>Welcome back</h1><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Cellphone number<input name="phone" type="tel" autocomplete="tel" maxlength="20" required></label><label>Your 4-digit PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="current-password" required></label><button class="button">Sign in →</button><p>New here? <a href="{{ url_for('eco.customer_register') }}">Create an account</a></p><p class="muted">Forgot your PIN or changed your number? <a href="{{ url_for('contact') }}">Contact the team</a>.</p></form><details><summary>Existing email account</summary><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input name="email" type="email" autocomplete="email" maxlength="200" required></label><label>Password<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label><button class="button outline">Sign in with email</button></form></details><p><a href="{{ url_for('login') }}">Owner sign in</a></p></section></div>{% endblock %}
