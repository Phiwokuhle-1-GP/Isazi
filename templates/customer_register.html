{% extends 'base.html' %}{% block content %}<form method="post" class="panel login form-stack"><span class="eyebrow light">WELCOME TO ISAZI</span><h1>Create your account</h1><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" maxlength="120" autocomplete="name" required></label><label>Email<input name="email" type="email" maxlength="200" autocomplete="email" required></label><label>Contact number<input name="phone" maxlength="25" autocomplete="tel" required></label><label>Password (at least 16 characters)<input name="password" type="password" minlength="16" maxlength="256" autocomplete="new-password" required></label><label>Confirm password<input name="confirm" type="password" minlength="16" maxlength="256" autocomplete="new-password" required></label><label class="check"><input type="checkbox" name="consent" required>I agree to the <a href="{{ url_for('policies') }}">privacy and store information</a>.</label><button class="button">Create Account →</button><a href="{{ url_for('eco.customer_login') }}">Already have an account? Sign in</a></form>{% endblock %}
