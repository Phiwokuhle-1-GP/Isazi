services:
  - type: web
    name: isazi-herbal-shop-client-portal
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: bash render_start.sh
    healthCheckPath: /health
    envVars:
      - key: DEMO_PAYMENTS_ENABLED
        value: "1"
      - key: ISAZI_CLIENT_DEMO
        value: "0"
      - key: PAYFAST_ENABLED
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: isazi-data
      mountPath: /var/data
      sizeGB: 1
